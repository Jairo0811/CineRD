
# ==========================================
# CineRD — Netlify Deployment Configuration
# ==========================================

[build]
  # Instalar dependencias y ejecutar pruebas
  # del backend y frontend.
  #
  # Validar el catálogo cinematográfico.
  #
  # Generar los archivos públicos de la demo.
  #
  # Compilar la aplicación React con Vite.

  command = "npm --prefix backend ci && npm --prefix backend test && npm --prefix backend run catalog:validate && npm --prefix frontend ci && npm --prefix frontend run lint && npm --prefix frontend test && node scripts/prepareNetlifyDemo.mjs && npm --prefix frontend run build"

  # Directorio publicado por Netlify.
  publish = "frontend/dist"

# ==========================================
# BUILD ENVIRONMENT
# ==========================================

[build.environment]
  NODE_VERSION = "22"

# ==========================================
# REACT ROUTER — SPA FALLBACK
# ==========================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
