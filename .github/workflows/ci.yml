name: CineRD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Probar auditoría de integración local de solo lectura (sin SQL)
        run: node --test ../scripts/auditLocalCineRD.test.mjs
      - run: npm run catalog:validate
      - name: Validate F-2.7 metadata candidates (offline / no SQL)
        run: npm run catalog:metadata:validate
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run editorial:audit
      - name: Probar cola humana de 7 cambios E-4 y 58 textos E-5 sin firmas
        run: node --test ../scripts/prepareClosureEditorial.test.mjs
      - run: node --test ../scripts/reportAdSenseReadiness.test.mjs
      - name: Test production API and monetization gates (offline)
        run: node --test ../scripts/reportProductionCommercial.test.mjs
      - name: Report production and AdSense blockers without enabling ads
        run: node ../scripts/reportProductionCommercial.mjs
      - run: node ../scripts/reportAdSenseReadiness.mjs
      - name: Test local-only original media viewer (without SQL or publication)
        run: node --test ../scripts/previewLocalMedia.test.mjs
      - run: npm run editorial:review
      - name: Triage 18 high-priority editorial observations (read-only)
        run: node ../scripts/reportHighPriorityEditorial.mjs
      - name: Test high-priority triage without changing approvals
        run: node --test ../scripts/reportHighPriorityEditorial.test.mjs
      - name: Validate integrated 1-4 release checks without forging sign-offs
        run: node --test ../scripts/releaseReadiness14.test.cjs
      - name: Report all four gates (informational while human reviews are pending)
        run: node ../scripts/releaseReadiness14.cjs --json
      - run: node --test ../scripts/editorialReviewAudit.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  rights-pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build optional rights-review preview
        run: VITE_MEDIA_RIGHTS_MODE=pilot npm run build
      - name: Verify excluded posters are not shipped
        run: node ../scripts/verifyRightsPilotBuild.mjs

  rights-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build with comprehensive image rights review
        run: VITE_MEDIA_RIGHTS_MODE=review npm run build
      - name: Validate no unlicensed media enter the artifact
        run: node ../scripts/verifyRightsReviewBuild.mjs

  cloudflare-production-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Simulate production main on Cloudflare (without VITE_MEDIA_RIGHTS_MODE)
        env:
          CF_PAGES: "1"
          CF_PAGES_BRANCH: main
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify the generated catalog cannot ship pending photos
        run: node ../scripts/verifyRightsReviewBuild.mjs
      - name: Assert production manifest's mode and commit
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const p = JSON.parse(fs.readFileSync("dist/demo/deploy-status.json", "utf8"));
            assert.equal(p.mediaRightsMode, "review");
            assert.equal(p.sourceCommit, process.env.COMMIT_SHA);
            assert.ok(Number.isInteger(p.mediaFilesCopied) && p.mediaFilesCopied >= 0);
          '

  backend-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend packages (Windows)
        run: npm ci
      - name: Run backend tests on Windows
        run: npm test
      - name: Test read-only local audit on Windows
        run: node --test ../scripts/auditLocalCineRD.test.mjs
      - name: Validate catalog on Windows
        run: npm run catalog:validate
      - name: Validate F-2.7 metadata on Windows (offline)
        run: npm run catalog:metadata:validate

  netlify-production-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Simulate Netlify deploy with unsafe pilot requested
        env:
          NETLIFY: "true"
          CONTEXT: deploy-preview
          VITE_MEDIA_RIGHTS_MODE: pilot
          COMMIT_REF: ${{ github.sha }}
        run: npm run build
      - name: Verify protected deployment contains no pending images
        run: node ../scripts/verifyRightsReviewBuild.mjs
      - name: Confirm Netlify mode is forced to review
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const status=JSON.parse(fs.readFileSync("dist/demo/deploy-status.json","utf8"));
            assert.equal(status.mediaRightsMode,"review");
            assert.equal(status.mediaFilesCopied,0);
          '
