name: CineRD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run catalog:validate
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run editorial:audit
      - run: node --test ../scripts/reportAdSenseReadiness.test.mjs
      - run: node ../scripts/reportAdSenseReadiness.mjs
      - run: npm run editorial:review
      - name: Validate integrated 1-4 release checks without forging sign-offs
        run: node --test ../scripts/releaseReadiness14.test.cjs
      - name: Report all four gates (informational while human reviews are pending)
        run: node ../scripts/releaseReadiness14.cjs --json
      - run: node --test ../scripts/editorialReviewAudit.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  rights-pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build optional rights-review preview
        run: VITE_MEDIA_RIGHTS_MODE=pilot npm run build
      - name: Verify excluded posters are not shipped
        run: node ../scripts/verifyRightsPilotBuild.mjs

  rights-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build with comprehensive image rights review
        run: VITE_MEDIA_RIGHTS_MODE=review npm run build
      - name: Validate no unlicensed media enter the artifact
        run: node ../scripts/verifyRightsReviewBuild.mjs

  cloudflare-production-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Simulate production main on Cloudflare (without VITE_MEDIA_RIGHTS_MODE)
        env:
          CF_PAGES: "1"
          CF_PAGES_BRANCH: main
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify the generated catalog cannot ship pending photos
        run: node ../scripts/verifyRightsReviewBuild.mjs
      - name: Assert production manifest's mode and commit
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const p = JSON.parse(fs.readFileSync("dist/demo/deploy-status.json", "utf8"));
            assert.equal(p.mediaRightsMode, "review");
            assert.equal(p.sourceCommit, process.env.COMMIT_SHA);
            assert.ok(Number.isInteger(p.mediaFilesCopied) && p.mediaFilesCopied >= 0);
          '

  backend-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend packages (Windows)
        run: npm ci
      - name: Run backend tests on Windows
        run: npm test
      - name: Validate catalog on Windows
        run: npm run catalog:validate
